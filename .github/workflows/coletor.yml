name: Coletor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consultar a GMGN e enviar ao radar
        run: node collector/run.mjs
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          RADAR_URL: ${{ secrets.RADAR_URL }}
          RADAR_PASSWORD: ${{ secrets.RADAR_PASSWORD }}
